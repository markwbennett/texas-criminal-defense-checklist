name: Validate checklist structure
on:
  pull_request:
    paths:
      - 'CriminalDefenseChecklist.md'
      - 'convert_checklist.py'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - 'CriminalDefenseChecklist.md'
      - 'convert_checklist.py'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install weasyprint markdown beautifulsoup4
      - name: Validate structure
        run: python scripts/validate_md.py
